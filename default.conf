# Bots de motores de busqueda y de previsualizacion de enlaces: reciben un
# HTML pre-renderizado (carpeta prerender/, generado por scripts/prerender.mjs
# contra las 256 URLs de sitemap.xml) en vez del SPA vacio. Usuarios reales
# no se ven afectados: $bot_prefix queda vacio y try_files cae exactamente
# en el mismo camino que tenia antes.
map $http_user_agent $bot_prefix {
    default "";
    ~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Applebot|Discordbot|SkypeUriPreview|redditbot|Pinterestbot) "/prerender";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # rewards-widget.js y sorteos-widget.js no llevan hash en el nombre y se
    # siguen editando en el mismo sitio (a diferencia de los bundles
    # versionados de arriba), así que no pueden ser "immutable": el
    # navegador debe revalidar en cada carga.
    location = /assets/rewards-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/sorteos-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/rewards-nav-button.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/game-pass-icon.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/guest-checkout-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/guest-account-claim-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/seo-meta.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/filters-i18n.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/meta-pixel-tracking.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/google-ads-tracking.js {
        add_header Cache-Control "no-cache";
    }
    # URLs de la version anterior del sitio, todavia indexadas en Google.
    # id_product se mantuvo igual entre /catalogo/:id y /product/:id.
    # Esquema absoluto https:// explicito: nginx esta detras de Traefik y
    # recibe la conexion en HTTP, asi que un "return 301 /ruta" relativo
    # sale como http:// y obliga a un segundo salto hasta https.
    location ~ ^/catalogo/([0-9]+)/?$ {
        return 301 https://$host/product/$1;
    }
    location = /home {
        return 301 https://$host/;
    }
    # No servir directamente los snapshots crudos a un usuario normal que
    # entre a /prerender/... a mano.
    location /prerender/ {
        internal;
    }
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Prerender $bot_prefix always;
        try_files $bot_prefix/index.html /index.html;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Prerender $bot_prefix always;
        try_files $bot_prefix$uri.html $bot_prefix$uri/index.html $uri $uri/ /index.html;
    }
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
