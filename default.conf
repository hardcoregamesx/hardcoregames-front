server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # rewards-widget.js no lleva hash en el nombre y lo seguimos editando en
    # el mismo sitio (a diferencia de los bundles versionados de arriba), así
    # que no puede ser "immutable": el navegador debe revalidar en cada carga.
    location = /assets/rewards-widget.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
