# Bots de motores de busqueda y de previsualizacion de enlaces: reciben un
# HTML pre-renderizado (carpeta prerender/, generado por scripts/prerender.mjs
# contra las 256 URLs de sitemap.xml) en vez del SPA vacio. Usuarios reales
# no se ven afectados: $bot_prefix queda vacio y try_files cae exactamente
# en el mismo camino que tenia antes.
map $http_user_agent $bot_prefix {
    default "";
    ~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Applebot|Discordbot|SkypeUriPreview|redditbot|Pinterestbot) "/prerender";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # rewards-widget.js y sorteos-widget.js no llevan hash en el nombre y se
    # siguen editando en el mismo sitio (a diferencia de los bundles
    # versionados de arriba), asi que no pueden ser "immutable": el
    # navegador debe revalidar en cada carga.
    location = /assets/rewards-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/sorteos-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/rewards-nav-button.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/game-pass-icon.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/guest-checkout-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/guest-account-claim-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/seo-meta.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/filters-i18n.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/meta-pixel-tracking.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/sistecredito-checkout-widget.js {
        add_header Cache-Control "no-cache";
    }
    location = /assets/google-ads-tracking.js {
        add_header Cache-Control "no-cache";
    }
    # URLs de la version anterior del sitio, todavia indexadas en Google.
    # id_product se mantuvo igual entre /catalogo/:id y /product/:id.
    # Esquema absoluto https:// explicito: nginx esta detras de Traefik y
    # recibe la conexion en HTTP, asi que un "return 301 /ruta" relativo
    # sale como http:// y obliga a un segundo salto hasta https.
    location ~ ^/catalogo/([0-9]+)/?$ {
        return 301 https://$host/product/$1;
    }
    location = /home {
        return 301 https://$host/;
    }
    # GSC (17/08/2026): "Duplicada, sin canonica" y "Soft 404" venian en
    # parte de rutas con "/" final (/product/2/) cayendo al SPA shell
    # generico en vez del snapshot real (/product/2). Se normaliza a la
    # version sin barra ANTES de try_files, para bots y usuarios reales.
    # Va despues de /catalogo para no interceptar su propio redirect.
    location ~ ^(?<clean>.+)/$ {
        return 301 https://$host$clean;
    }
    # No servir directamente los snapshots crudos a un usuario normal que
    # entre a /prerender/... a mano. ^~ para que gane siempre sobre el
    # location regex de arriba (que si no, tendria prioridad por ser regex).
    location ^~ /prerender/ {
        internal;
    }
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Prerender $bot_prefix always;
        try_files $bot_prefix/index.html /index.html;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Prerender $bot_prefix always;
        # $uri/index.html (sin prefijo bot) va ANTES de @spa: cubre las
        # landings estaticas propias (fc27, gamepassultimate, psplus,
        # grandtheftautovi) que tienen su index.html real en una carpeta
        # fisica pero nunca entraron al cron de prerender (GSC 18/08/2026:
        # devolvian 404 real a Googlebot porque @spa corta bots sin
        # snapshot). No afecta al fix de soft-404 del 17/08: las rutas SPA
        # sin carpeta fisica (p.ej. un id de producto borrado) no tienen
        # $uri/index.html y siguen cayendo a @spa igual que antes.
        try_files $bot_prefix$uri.html $bot_prefix$uri/index.html $uri/index.html @spa;
    }
    # GSC (17/08/2026): un bot pidiendo una URL sin snapshot prerenderizado
    # (p.ej. un id de producto que ya no existe) caia aqui igual y recibia
    # el SPA shell generico con 200 -> soft 404 para Google. Los usuarios
    # reales siguen exactamente igual que antes (SPA renderiza su propio
    # estado "no encontrado" en el cliente).
    #
    # 22/08/2026: el "return 404" cortaba ANTES de probar $uri, asi que un
    # bot (facebookexternalhit, WhatsApp) pidiendo un archivo estatico real
    # sin snapshot -como /logo.png para el preview de og:image- tambien
    # caia en el soft-404, aunque el archivo existiera. Se prueba $uri/$uri/
    # primero (identico para bots y usuarios) y solo se decide el soft-404
    # en @spa_notfound si de verdad no hay nada que servir.
    location @spa {
        try_files $uri $uri/ @spa_notfound;
    }
    location @spa_notfound {
        if ($bot_prefix != "") {
            return 404;
        }
        rewrite ^ /index.html break;
    }
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
